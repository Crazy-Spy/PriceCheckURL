name: Price Check & Auto Update

on:
  schedule:
    # Executa a cada 2 horas no minuto 22 (00:22, 02:22, 04:22, 06:22, ... UTC)
    - cron: '22 */2 * * *'
  workflow_dispatch: # Permite disparo manual via interface do GitHub ou API

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browsers (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Run Price Check Engine
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m scraper.main

      - name: Commit and push updated price data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração de dados detectada."
          else
            git commit -m "chore(prices): automated update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

